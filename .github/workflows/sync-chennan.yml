name: Sync ChenNan Workspace v2

on:
  push:
    paths:
      - ".github/workflows/sync-chennan.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout latest ChenNan source
        uses: actions/checkout@v4
        with:
          repository: dalulu05168/growth-story-workspace
          ref: main
          path: _chennan_source

      - name: Sync source into 005 root
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='_chennan_source/' \
            --exclude='cloudphone-ready/' \
            --exclude='.github/workflows/' \
            _chennan_source/ ./
          rm -rf _chennan_source

      - name: Commit synchronized workspace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Sync latest ChenNan workspace"
          git push origin main
