<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Nuvexa Pro · Ops</title>
<style>
:root{--bg:#0e0d12;--panel:#18171d;--panel2:#201f26;--line:#2b2932;--text:#f5f6f8;--muted:#84838e;--green:#00e676;--amber:#e7b34b;--red:#ff6068;--blue:#76a0ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,"Microsoft YaHei UI","Segoe UI",sans-serif}
body{overflow:hidden}.shell{display:grid;grid-template-columns:78px 1fr;height:100vh}.side{background:#141319;border-right:1px solid #25232b;padding:14px 10px;display:flex;flex-direction:column;gap:10px}
.logo{width:42px;height:42px;border-radius:14px;margin:0 auto 8px;display:grid;place-items:center;background:#0e2a1c;border:1px solid #1b5637;color:var(--green);font-weight:900}
.nav{display:flex;flex-direction:column;gap:8px;overflow:auto;padding:2px}.nav button{height:46px;border-radius:13px;border:1px solid #27252d;background:#19181f;color:#777681;cursor:pointer;font-size:17px;transition:.16s}.nav button:hover{transform:translateY(-1px);border-color:#3a3742;color:#d9d9de}.nav button.active{background:var(--green);border-color:var(--green);color:#07150d;box-shadow:0 8px 22px rgba(0,230,118,.18)}
.main{min-width:0}.top{height:70px;border-bottom:1px solid #24222a;background:#111016;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.top h1{font-size:20px;margin:0}.badges{display:flex;gap:8px;align-items:center}.badge{font-size:11px;border:1px solid #33313a;padding:7px 10px;border-radius:999px;background:#19181f;color:#a6a5ae}.badge.off{color:#ff7a81;border-color:#522d33;background:#25191d}.badge.ok{color:var(--green);border-color:#20543a;background:#10241a}
.content{height:calc(100vh - 70px);overflow:auto;padding:14px 16px 18px}.notice{border:1px solid #4b3c23;background:#231e14;color:#d8c28a;border-radius:14px;padding:11px 14px;font-size:11px;margin-bottom:12px}.pagehead{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:12px}.pagehead h2{margin:0;font-size:27px;letter-spacing:-.04em}.pagehead p{margin:5px 0 0;color:var(--muted);font-size:11px}.actions{display:flex;gap:8px}.btn{border:1px solid #34313b;background:#222129;color:#c8c8cf;border-radius:10px;padding:9px 12px;font-size:10px}.btn.primary{background:var(--green);border-color:var(--green);color:#07150d;font-weight:800}.btn[disabled]{opacity:.42;cursor:not-allowed}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}.metric{background:linear-gradient(145deg,#19181f,#15141a);border:1px solid #29272f;border-radius:16px;padding:13px 14px}.metric label{font-size:10px;color:#7d7c87}.metric strong{display:block;margin-top:7px;font-size:24px}.metric small{display:block;margin-top:3px;color:#65646f;font-size:9px}.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.75fr);gap:12px}.grid22{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:linear-gradient(155deg,#1a1920,#17161d);border:1px solid #29272f;border-radius:18px;overflow:hidden}.panel h3{font-size:13px;margin:0}.ph{padding:13px 15px;border-bottom:1px solid #27252d;display:flex;justify-content:space-between;align-items:center}.ph small{color:#777783;font-size:9px}.pb{padding:14px}.table{width:100%;border-collapse:collapse;font-size:10px}.table th{background:#201f26;color:#7d7c87;text-align:left;padding:9px;border-bottom:1px solid #2d2b34}.table td{padding:9px;border-bottom:1px solid #24232a;color:#d6d6db}.empty{padding:36px 18px;text-align:center;color:#787782;font-size:11px}.empty b{display:block;color:#d9d9de;font-size:13px;margin-bottom:6px}.tag{display:inline-block;border-radius:999px;padding:4px 8px;border:1px solid #34313b;background:#26242c;color:#b7b6bf;font-size:9px}.tag.ok{background:#10271c;border-color:#1b5a39;color:var(--green)}.tag.warn{background:#2a2417;border-color:#5f4c23;color:var(--amber)}.tag.bad{background:#2c191d;border-color:#5c2b32;color:#ff737a}.route{display:grid;gap:7px}.step{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:9px 10px;background:#15141a;border:1px solid #2a2831;border-radius:12px}.step i{font-style:normal;width:30px;height:30px;border-radius:9px;background:#10271c;color:var(--green);display:grid;place-items:center;font-weight:800;font-size:9px}.step b{font-size:10px}.step small{display:block;color:#777680;margin-top:3px;font-size:8px}.route .arrow{text-align:center;color:#55535d;font-size:11px}.auxgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}.aux{padding:9px;border-radius:12px;border:1px solid #2b2932;background:#15141a}.aux strong{font-size:12px;color:var(--green)}.aux span{float:right;font-size:9px;color:#85848f}.aux small{display:block;margin-top:7px;color:#696873;font-size:8px}.footerline{margin-top:12px;color:#62616b;font-size:9px;text-align:right}
@media(max-width:1300px){.cards{grid-template-columns:repeat(3,1fr)}.auxgrid{grid-template-columns:repeat(5,1fr)}}@media(max-width:980px){.shell{grid-template-columns:64px 1fr}.grid2,.grid22{grid-template-columns:1fr}.auxgrid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="shell">
<aside class="side"><div class="logo">N</div><div id="nav" class="nav"></div></aside>
<main class="main">
<header class="top"><h1>Nuvexa Pro · 自动走群运营中心</h1><div class="badges"><span class="badge">v0.2.6</span><span class="badge off">本地执行端离线</span></div></header>
<section id="content" class="content"></section>
</main>
</div>
<script>
const pages=[
['dashboard','⌂','运营总览'],['accounts','◉','账户连接'],['monitor','◎','群组人员监控'],['groups','▦','群组中心'],
['customers','♙','客户中心'],['messages','✉','消息中心'],['telegram','➤','Telegram 消息'],['batchJoin','＋','批量进群'],
['batchSend','⇢','批量发送'],['queue','≡','发送队列'],['automation','⚙','自动化营销'],['risks','!','风险中心'],
['analytics','▥','数据分析'],['system','⋯','系统设置']
];
const names=Object.fromEntries(pages.map(x=>[x[0],x[2]]));
const nav=document.getElementById('nav'),content=document.getElementById('content');
pages.forEach(([id,ico,name])=>{const b=document.createElement('button');b.textContent=ico;b.title=name;b.onclick=()=>go(id);b.dataset.id=id;nav.appendChild(b)});
const metric=(a,b,c)=>'<div class="metric"><label>'+a+'</label><strong>'+b+'</strong><small>'+c+'</small></div>';
const head=(t,d,a='')=>'<div class="pagehead"><div><h2>'+t+'</h2><p>'+d+'</p></div><div class="actions">'+a+'</div></div>';
const offline='<div class="notice">云端验收模式：当前尚未连接 Windows 本地执行端。页面只用于检查 UI、布局和导航；所有账号、群组、Telegram、WhatsApp 数据均保持空值，所有真实写操作已禁用，不会生成演示数据或伪造成功状态。</div>';
const panel=(t,s,body)=>'<section class="panel"><div class="ph"><div><h3>'+t+'</h3><small>'+s+'</small></div></div>'+body+'</section>';
const empty=(t,d)=>'<div class="empty"><b>'+t+'</b>'+d+'</div>';
function dashboard(){
let aux='';for(let i=1;i<=18;i++)aux+='<div class="aux"><strong>#'+String(i).padStart(2,'0')+'</strong><span>'+(i%2?'男':'女')+'</span><small>未连接 · 等待本地 Session</small></div>';
return offline+head('运营总览','60 个辅助号、助理/教授、群组监控与消息路由统一指挥台','<button class="btn primary" disabled>全员待命</button>')+
'<div class="cards">'+metric('在线辅助号','0 / 60','本地执行端未连接')+metric('助理 / 教授','0 / 2','等待 Session')+metric('监控群组','0','真实数据尚未同步')+metric('今日转发','0','无模拟任务')+metric('失败任务','0','无伪造状态')+'</div>'+
'<div class="grid2">'+panel('辅助号队伍','01–60 唯一编号 + 男女标记','<div class="pb"><div class="auxgrid">'+aux+'</div></div>')+
panel('Telegram → WhatsApp 路由','编号+性别与助理/教授规则共用真实发送链路','<div class="pb"><div class="route"><div class="step"><i>01</i><div><b>Telegram 来源群</b><small>读取真实消息后进入匹配</small></div></div><div class="arrow">↓</div><div class="step"><i>02</i><div><b>角色 / 编号 + 性别匹配</b><small>无匹配时不创建任务</small></div></div><div class="arrow">↓</div><div class="step"><i>03</i><div><b>对应 WhatsApp Session</b><small>离线保持 WAITING，不假成功</small></div></div><div class="arrow">↓</div><div class="step"><i>04</i><div><b>目标 WhatsApp 群</b><small>真实 ACK 后才记 SUCCESS</small></div></div></div></div>')+'</div>'+
'<div class="grid22" style="margin-top:12px">'+panel('发送任务','等待 / 处理中 / 成功 / 失败',empty('暂无真实任务','本地执行端接入后同步任务队列。'))+panel('最近群组事件','JOIN / LEAVE / Presence',empty('暂无真实事件','首次快照只建立基线；记录保留 15 天。'))+'</div>';
}
function generic(id){
const titles={
accounts:['账户连接','助理、教授与 60 个辅助号 Session 管理'],
monitor:['群组人员监控','进群、退群及可见在线状态；不可获取时显示“未知”'],
groups:['群组中心','真实群组规模、成员变化和运营统计'],
customers:['客户中心','客户资料、阶段与跟进状态'],
messages:['消息中心','真实对话与发送记录'],
telegram:['Telegram 消息','教授 / 助理角色与辅助号编号+性别路由'],
batchJoin:['批量进群','仅助理 / 教授商业账号执行，失败不记成功'],
batchSend:['批量发送','辅助号真实 Session 执行，离线即阻断'],
queue:['发送队列','WAITING / PROCESSING / SUCCESS / FAILED'],
automation:['自动化营销','真实触发器与执行记录'],
risks:['风险中心','登录、发送、群组和账号风险'],
analytics:['数据分析','客户、任务和业务账号真实统计'],
system:['系统设置','许可证、备份、安全与本地执行端状态']
};
const [t,d]=titles[id]||[names[id]||id,''];
return offline+head(t,d,'<button class="btn" disabled>需要本地执行端</button>')+
'<div class="cards">'+metric('状态','未连接','Cloud shell')+metric('真实记录','0','不生成演示数据')+metric('待处理','0','无本地任务')+metric('异常','0','暂无真实来源')+metric('同步时间','—','等待执行端')+'</div>'+
panel(t+'数据','连接 Windows 执行端后显示真实数据','<table class="table"><thead><tr><th>项目</th><th>状态</th><th>来源</th><th>更新时间</th></tr></thead><tbody><tr><td>本地执行端</td><td><span class="tag bad">离线</span></td><td>Windows</td><td>—</td></tr><tr><td>WhatsApp Session</td><td><span class="tag warn">未知</span></td><td>本地</td><td>—</td></tr><tr><td>Telegram 路由</td><td><span class="tag warn">未同步</span></td><td>本地配置</td><td>—</td></tr></tbody></table>');
}
function go(id){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));content.innerHTML=id==='dashboard'?dashboard():generic(id);location.hash=id}
const start=(location.hash||'#dashboard').slice(1);go(names[start]?start:'dashboard');
</script>
</body>
</html>
