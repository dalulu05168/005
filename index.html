<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Nuvexa Pro v0.2.7 · 转发控制台</title>
<style>
:root{--bg:#080a0d;--bg2:#0d1115;--panel:#11161b;--panel2:#151c22;--line:#243039;--line2:#31404a;--text:#f5f8f6;--muted:#82908a;--green:#58f58c;--green2:#1ed760;--yellow:#f7cc5d;--red:#ff6070;--gray:#52606a;--cyan:#65d9ff;--shadow:0 18px 56px rgba(0,0,0,.34)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(circle at 78% -8%,rgba(88,245,140,.11),transparent 30%),linear-gradient(135deg,#07090b 0%,#0b0e12 48%,#07090b 100%);color:var(--text)}button,input,select{font:inherit}.hidden{display:none!important}
.login-shell{min-height:100vh;display:grid;grid-template-columns:1.08fr .92fr;overflow:hidden}.login-brand{position:relative;padding:7vw;display:flex;flex-direction:column;justify-content:center;border-right:1px solid rgba(255,255,255,.06)}.login-brand:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to right,#000,transparent)}.logo{position:relative;display:flex;align-items:center;gap:14px;font-weight:800;letter-spacing:.06em;font-size:22px}.logo-mark{width:38px;height:38px;border:1px solid rgba(88,245,140,.7);border-radius:12px;display:grid;place-items:center;box-shadow:0 0 28px rgba(88,245,140,.16) inset,0 0 20px rgba(88,245,140,.08)}.logo-mark:before{content:"N";color:var(--green);font-weight:900}.hero{position:relative;margin-top:92px;max-width:720px}.eyebrow{color:var(--green);font-size:12px;letter-spacing:.22em;text-transform:uppercase}.hero h1{font-size:clamp(48px,5vw,82px);line-height:.98;margin:18px 0 22px;letter-spacing:-.045em}.hero p{font-size:18px;line-height:1.8;color:#a6b1ac;max-width:640px}.route-mini{display:flex;align-items:center;gap:11px;margin-top:36px;color:#bac5c0;font-size:13px;flex-wrap:wrap}.route-mini .node{border:1px solid var(--line);background:rgba(17,22,27,.78);border-radius:11px;padding:9px 12px}.route-mini .arrow{color:var(--green)}
.login-side{padding:7vw;display:flex;align-items:center;justify-content:center}.login-card{width:min(460px,100%);background:linear-gradient(180deg,rgba(21,28,34,.92),rgba(12,16,20,.94));border:1px solid var(--line2);border-radius:24px;padding:34px;box-shadow:var(--shadow),0 0 50px rgba(88,245,140,.04)}.login-card h2{margin:0 0 8px;font-size:28px}.login-card>p{margin:0 0 30px;color:var(--muted)}.field{margin:16px 0}.field label{display:block;font-size:12px;color:#a8b4ae;margin-bottom:8px}.field input,.field select{width:100%;background:#0d1216;color:#eef4f0;border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none}.field input:focus,.field select:focus{border-color:rgba(88,245,140,.65);box-shadow:0 0 0 3px rgba(88,245,140,.08)}.primary{width:100%;border:0;border-radius:12px;background:linear-gradient(135deg,var(--green),#28da68);color:#06100a;font-weight:800;padding:14px;cursor:pointer;box-shadow:0 10px 28px rgba(88,245,140,.18)}.primary:disabled{opacity:.45;cursor:not-allowed}.login-status{margin-top:20px;border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}.login-error{min-height:20px;color:var(--red);font-size:12px;margin-top:10px}
.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{position:sticky;top:0;height:100vh;background:rgba(8,11,14,.92);backdrop-filter:blur(16px);border-right:1px solid var(--line);padding:24px 18px;display:flex;flex-direction:column}.sidebar .logo{font-size:17px;padding:4px 8px 28px}.version{font-size:10px;color:var(--green);border:1px solid rgba(88,245,140,.25);padding:4px 7px;border-radius:999px}.nav{display:flex;flex-direction:column;gap:8px}.nav button{display:flex;align-items:center;gap:12px;width:100%;border:1px solid transparent;background:transparent;color:#95a19b;text-align:left;padding:12px 13px;border-radius:12px;cursor:pointer}.nav button:hover{color:#fff;background:#12181d}.nav button.active{color:#ecfff2;background:linear-gradient(90deg,rgba(88,245,140,.13),rgba(88,245,140,.02));border-color:rgba(88,245,140,.2);box-shadow:inset 3px 0 0 var(--green)}.nav .ico{width:26px;height:26px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:11px}.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px 0}.status-line{display:flex;align-items:center;gap:8px;font-size:12px;color:#a4afa9;margin:8px 0}.dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 12px currentColor}.dot.on{background:var(--green)}.logout{margin-top:12px;background:none;border:1px solid var(--line);color:#9eaaa4;border-radius:10px;padding:9px 11px;width:100%;cursor:pointer}
.main{min-width:0}.topbar{height:76px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:rgba(9,12,15,.82);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.05)}.top-title strong{display:block;font-size:16px}.top-title span{font-size:11px;color:var(--muted)}.top-status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.pill{font-size:11px;border:1px solid var(--line);padding:7px 10px;border-radius:999px;color:#a8b3ad;background:rgba(20,26,31,.75)}.pill.ok{border-color:rgba(88,245,140,.25);color:var(--green);background:rgba(88,245,140,.07)}.pill.bad{border-color:rgba(255,96,112,.26);color:#ff909b;background:rgba(255,96,112,.07)}.content{padding:28px 30px 54px;max-width:1740px;margin:auto}.page-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.page-head h1{font-size:28px;letter-spacing:-.025em;margin:0 0 7px}.page-head p{margin:0;color:var(--muted);font-size:13px}.sync-note{font-size:11px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(8,minmax(120px,1fr));gap:12px}.metric{background:linear-gradient(180deg,#151b20,#10151a);border:1px solid var(--line);border-radius:15px;padding:16px;min-height:94px}.metric span{font-size:11px;color:var(--muted)}.metric strong{display:block;font-size:24px;margin-top:10px;letter-spacing:-.02em}.metric strong.green{color:var(--green)}.metric strong.red{color:#ff7c89}.metric strong.yellow{color:var(--yellow)}
.panel{background:linear-gradient(180deg,rgba(20,27,32,.92),rgba(13,18,22,.94));border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 14px 34px rgba(0,0,0,.13)}.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.panel-title h3{margin:0;font-size:14px}.panel-title span{font-size:11px;color:var(--muted)}.global-progress{margin:14px 0 20px}.energy{height:12px;display:flex;overflow:hidden;border-radius:999px;background:#252e34;border:1px solid rgba(255,255,255,.045)}.energy>i{height:100%;display:block;min-width:0;transition:width .35s ease}.energy .success{background:linear-gradient(90deg,#22d765,#68ff98);box-shadow:0 0 12px rgba(88,245,140,.25)}.energy .processing{background:linear-gradient(90deg,#d8a526,#ffe276)}.energy .failed{background:linear-gradient(90deg,#cf4052,#ff7180)}.energy .waiting{background:#53616a}.energy-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:11px}.energy-legend b{color:#dce6e0;font-weight:600}.energy-legend .blocked b{color:#ff8d98}
.dashboard-grid{display:grid;grid-template-columns:1.45fr .55fr;gap:14px;margin-top:14px}.account-grid{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:12px}.account-card{border:1px solid var(--line);border-radius:15px;padding:15px;background:#10161a;transition:.18s transform,.18s border-color}.account-card:hover{transform:translateY(-2px);border-color:#3b4b55}.account-top{display:flex;justify-content:space-between;gap:10px}.role{font-size:10px;color:var(--green);text-transform:uppercase;letter-spacing:.12em}.account-name{font-weight:700;margin-top:4px;font-size:14px}.state{font-size:10px;padding:5px 7px;border-radius:999px;border:1px solid var(--line);height:max-content;color:#9ba6a1}.state.on{color:var(--green);border-color:rgba(88,245,140,.24)}.state.busy{color:var(--yellow);border-color:rgba(247,204,93,.24)}.account-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 12px}.mini{background:#0b1014;border:1px solid rgba(255,255,255,.04);border-radius:9px;padding:8px}.mini span{display:block;color:#6f7c76;font-size:9px}.mini b{font-size:12px}.account-card .energy{height:8px}.card-meta{display:flex;justify-content:space-between;margin-top:11px;color:#6f7d76;font-size:9px}.side-stat{display:grid;gap:12px}.connection-card{min-height:128px}.big-status{font-size:28px;font-weight:800;margin:12px 0 6px}.big-status.ok{color:var(--green)}.big-status.bad{color:#ff7b87}.route-flow{display:grid;gap:8px}.flow-node{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#0f1418;font-size:11px}.flow-arrow{text-align:center;color:var(--green);font-size:12px}.empty{padding:36px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed var(--line);border-radius:14px}.section-gap{margin-top:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters button{background:#0e1418;border:1px solid var(--line);color:#8f9a95;padding:8px 11px;border-radius:9px;cursor:pointer;font-size:11px}.filters button.active{border-color:rgba(88,245,140,.4);color:var(--green);background:rgba(88,245,140,.07)}.table-wrap{overflow:auto}.account-table{width:100%;border-collapse:collapse;font-size:11px}.account-table th{color:#6e7b75;font-weight:500;text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}.account-table td{padding:12px 10px;border-bottom:1px solid rgba(255,255,255,.045);color:#c7d1cc;white-space:nowrap}.account-table tr:hover td{background:rgba(255,255,255,.018)}.table-energy{width:150px;min-width:150px}.table-energy .energy{height:7px}.pct{color:var(--green);font-weight:700}
.group-layout{display:grid;grid-template-columns:1.02fr .98fr;gap:14px}.group-hero{padding:24px}.group-switch{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px;border-radius:14px;background:#0d1317;border:1px solid var(--line);margin:16px 0}.switch-copy strong{font-size:18px}.switch-copy p{margin:7px 0 0;color:var(--muted);font-size:11px}.switch{position:relative;width:62px;height:34px;border-radius:30px;background:#303940;border:1px solid #4b555c;cursor:pointer;flex:none}.switch:before{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:#a4ada8;left:3px;top:3px;transition:.22s}.switch.on{background:rgba(88,245,140,.2);border-color:rgba(88,245,140,.55);box-shadow:0 0 24px rgba(88,245,140,.12)}.switch.on:before{left:31px;background:var(--green)}.switch:disabled{opacity:.45;cursor:not-allowed}.forbidden{border-color:rgba(255,96,112,.34)!important;background:linear-gradient(180deg,rgba(84,22,31,.22),rgba(18,14,18,.86))!important}.forbidden-banner{display:flex;gap:12px;align-items:center;color:#ff9aa4;border:1px solid rgba(255,96,112,.26);background:rgba(255,96,112,.07);padding:13px;border-radius:12px;margin-bottom:14px}.group-form{display:grid;grid-template-columns:1fr;gap:10px}.group-form select,.group-form input{width:100%;background:#0d1216;color:#eaf0ec;border:1px solid var(--line);border-radius:11px;padding:12px}.save-btn{border:1px solid rgba(88,245,140,.34);background:rgba(88,245,140,.1);color:var(--green);border-radius:11px;padding:11px 13px;font-weight:700;cursor:pointer}.save-btn:disabled{opacity:.45}.policy-code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;color:#ff929d;background:#120d10;border:1px solid rgba(255,96,112,.18);padding:8px 10px;border-radius:9px;word-break:break-all}.toast{position:fixed;right:24px;bottom:24px;z-index:99;max-width:360px;border:1px solid var(--line2);background:#151b20;color:#eaf0ec;padding:12px 14px;border-radius:11px;box-shadow:var(--shadow);font-size:12px}.toast.error{border-color:rgba(255,96,112,.4);color:#ff9ca6}
@media(max-width:1250px){.metrics{grid-template-columns:repeat(4,1fr)}.account-grid{grid-template-columns:repeat(2,1fr)}.dashboard-grid,.group-layout{grid-template-columns:1fr}.app{grid-template-columns:210px 1fr}}@media(max-width:780px){.login-shell{grid-template-columns:1fr}.login-brand{display:none}.login-side{padding:24px}.app{display:block}.sidebar{height:auto;position:sticky;z-index:20;top:0;padding:10px}.sidebar .logo,.side-foot{display:none}.nav{flex-direction:row}.nav button{font-size:0;justify-content:center}.nav .ico{font-size:10px}.topbar{top:58px;padding:0 14px}.top-status .pill:nth-child(n+3){display:none}.content{padding:18px 14px 40px}.metrics{grid-template-columns:repeat(2,1fr)}.account-grid{grid-template-columns:1fr}.page-head{align-items:start;flex-direction:column}}
</style>
</head>
<body>
<section id="loginView" class="login-shell">
  <div class="login-brand">
    <div class="logo"><span class="logo-mark"></span><span>Nuvexa Pro</span><span class="version">v0.2.7</span></div>
    <div class="hero"><div class="eyebrow">Forwarding Command Center</div><h1>Telegram →<br>WhatsApp</h1><p>助理号、教授号、辅助号统一转发管理。真实 Session 状态、真实发送回执、单目标群发布控制。</p><div class="route-mini"><span class="node">Telegram</span><span class="arrow">→</span><span class="node">角色 / 编号 + 性别</span><span class="arrow">→</span><span class="node">WhatsApp Session</span><span class="arrow">→</span><span class="node">统一目标群</span></div></div>
  </div>
  <div class="login-side"><form id="loginForm" class="login-card"><h2>进入转发控制台</h2><p>仅授权账号可访问系统。</p><div class="field"><label>账号</label><input id="username" autocomplete="username" value="admin" required></div><div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginBtn" class="primary" type="submit">进入系统</button><div id="loginError" class="login-error"></div><div class="login-status"><span>云端 API <b id="loginCloud">检测中</b></span><span>数据模式 <b>真实数据</b></span></div></form></div>
</section>
<div id="appView" class="app hidden">
  <aside class="sidebar"><div class="logo"><span class="logo-mark"></span><span>Nuvexa Pro</span><span class="version">v0.2.7</span></div><nav class="nav"><button data-page="dashboard" class="active"><span class="ico">01</span><span>运营大屏</span></button><button data-page="accounts"><span class="ico">02</span><span>账号管理</span></button><button data-page="group"><span class="ico">03</span><span>群组与转发设置</span></button></nav><div class="side-foot"><div class="status-line"><span id="sideDot" class="dot"></span><span id="sideExecutor">本地执行端离线</span></div><div class="status-line"><span>●</span><span id="sideGroup">发布禁区</span></div><button id="logoutBtn" class="logout">退出登录</button></div></aside>
  <main class="main"><header class="topbar"><div class="top-title"><strong id="topPageTitle">运营大屏</strong><span>Telegram → WhatsApp 转发控制</span></div><div class="top-status"><span id="executorPill" class="pill bad">执行端离线</span><span id="groupPill" class="pill bad">发布禁区</span><span id="telegramPill" class="pill">Telegram —</span><span id="syncPill" class="pill">最后同步 —</span></div></header><div id="pageHost" class="content"></div></main>
</div>
<div id="toast" class="toast hidden"></div>
<script>
const API='https://nuvexa-ops-bridge.onrender.com';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={token:sessionStorage.getItem('nuvexa_ops_token')||'',page:'dashboard',data:null,filter:'ALL',timer:null};
const fmtNum=v=>Number.isFinite(Number(v))?Number(v).toLocaleString('zh-CN'):'—';
const fmtPct=v=>Number.isFinite(Number(v))?`${Number(v).toFixed(Number(v)%1?1:0)}%`:'—';
const fmtTime=v=>{if(!v)return '—';const d=new Date(v);return Number.isFinite(d.getTime())?d.toLocaleString('zh-CN',{hour12:false}):'—'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(msg,error=false){const el=$('#toast');el.textContent=msg;el.className=`toast${error?' error':''}`;setTimeout(()=>el.classList.add('hidden'),2800)}
async function api(path,opt={}){const headers={'content-type':'application/json',...(opt.headers||{})};if(state.token)headers.authorization=`Bearer ${state.token}`;const r=await fetch(API+path,{...opt,headers});const j=await r.json().catch(()=>({}));if(r.status===401&&path!='/v1/auth/login'){logout();throw new Error('登录已失效')}if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);return j}
async function cloudCheck(){try{const r=await fetch(API+'/v1/health',{cache:'no-store'});$('#loginCloud').textContent=r.ok?'已连接':'异常';$('#loginCloud').style.color=r.ok?'var(--green)':'var(--red)'}catch{$('#loginCloud').textContent='连接中';$('#loginCloud').style.color='var(--yellow)'}}
function logout(){state.token='';sessionStorage.removeItem('nuvexa_ops_token');clearInterval(state.timer);state.timer=null;$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden')}
function loginSuccess(token){state.token=token;sessionStorage.setItem('nuvexa_ops_token',token);$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');setPage(location.hash.replace('#','')||'dashboard');refresh();clearInterval(state.timer);state.timer=setInterval(refresh,5000)}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('#loginBtn');btn.disabled=true;$('#loginError').textContent='';try{const j=await api('/v1/auth/login',{method:'POST',body:JSON.stringify({username:$('#username').value.trim(),password:$('#password').value})});loginSuccess(j.token)}catch(err){$('#loginError').textContent=err.message}finally{btn.disabled=false}});$('#logoutBtn').addEventListener('click',logout);$$('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function setPage(page){if(!['dashboard','accounts','group'].includes(page))page='dashboard';state.page=page;location.hash=page;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#topPageTitle').textContent={dashboard:'运营大屏',accounts:'账号管理',group:'群组与转发设置'}[page];render()}
window.addEventListener('hashchange',()=>setPage(location.hash.replace('#','')));
function updateChrome(d){const online=Boolean(d?.executorOnline);const p=d?.groupPolicy||{};$('#sideDot').classList.toggle('on',online);$('#sideExecutor').textContent=online?'本地执行端在线':'本地执行端离线';$('#sideGroup').textContent=p.enabled?'允许发布':'发布禁区';$('#executorPill').className=`pill ${online?'ok':'bad'}`;$('#executorPill').textContent=online?'执行端在线':'执行端离线';$('#groupPill').className=`pill ${p.enabled?'ok':'bad'}`;$('#groupPill').textContent=p.enabled?'允许发布':'发布禁区';const tg=d?.snapshot?.telegram||{};$('#telegramPill').className=`pill ${tg.running?'ok':''}`;$('#telegramPill').textContent=`Telegram ${tg.running?'运行中':'未运行'}`;$('#syncPill').textContent=`最后同步 ${fmtTime(d?.snapshot?.executor?.heartbeatAt)}`}
async function refresh(){if(!state.token)return;try{state.data=await api('/v1/dashboard');updateChrome(state.data);render()}catch(err){toast(err.message,true)}}
function energyValues(x={}){const s=+x.success||0,p=+x.processing||0,f=+x.failed||0,w=+x.waiting||0,b=+x.blocked||0,total=Math.max(0,s+p+f+w+b);return {s,p,f,w,b,total}}
function energy(x={}){const v=energyValues(x),pct=n=>v.total?(n/v.total*100):0;return `<div class="energy"><i class="success" style="width:${pct(v.s)}%"></i><i class="processing" style="width:${pct(v.p)}%"></i><i class="failed" style="width:${pct(v.f)}%"></i><i class="waiting" style="width:${pct(v.w+v.b)}%"></i></div>`}
function metric(label,value,cls=''){return `<div class="metric"><span>${label}</span><strong class="${cls}">${value}</strong></div>`}
function statusLabel(a){if(a.status==='online')return ['在线','on'];if((+a.processing||0)>0)return ['处理中','busy'];if(a.status==='not_bound')return ['未绑定',''];return ['离线','']}
function accountCard(a){const [label,cls]=statusLabel(a);return `<article class="account-card"><div class="account-top"><div><div class="role">${esc(a.roleLabel||a.role)}</div><div class="account-name">${esc(a.kind==='AUXILIARY'?`辅助号 ${a.auxCode||'—'} · ${a.genderLabel||'未设置'}`:a.name)}</div></div><span class="state ${cls}">${label}</span></div><div class="account-kpis"><div class="mini"><span>成功</span><b>${fmtNum(a.success)}</b></div><div class="mini"><span>失败</span><b>${fmtNum(a.failed)}</b></div><div class="mini"><span>等待</span><b>${fmtNum(a.waiting)}</b></div><div class="mini"><span>处理中</span><b>${fmtNum(a.processing)}</b></div></div>${energy(a)}<div class="card-meta"><span>成功率 <b class="pct">${fmtPct(a.successRate)}</b></span><span>最后发送 ${fmtTime(a.lastSentAt)}</span></div></article>`}
function dashboard(){const d=state.data||{},s=d.snapshot?.summary||{},accounts=d.snapshot?.accounts||[],p=d.groupPolicy||{};return `<div class="page-head"><div><h1>转发运营大屏</h1><p>真实 Session、真实任务队列、真实 WhatsApp 回执。没有执行端数据时不生成演示值。</p></div><div class="sync-note">云端状态：${d.executorOnline?'实时同步':'等待 Windows 执行端连接'}</div></div><div class="metrics">${metric('账号总数',fmtNum(s.totalAccounts))}${metric('在线账号',fmtNum(s.onlineAccounts),'green')}${metric('今日任务',fmtNum(s.total))}${metric('处理中',fmtNum(s.processing),'yellow')}${metric('成功',fmtNum(s.success),'green')}${metric('失败',fmtNum(s.failed),'red')}${metric('等待',fmtNum(s.waiting))}${metric('整体成功率',fmtPct(s.successRate),'green')}</div><section class="panel global-progress section-gap"><div class="panel-title"><h3>总转发进度 · 能量条</h3><span>${d.executorOnline?'LIVE':'OFFLINE'}</span></div>${energy(s)}<div class="energy-legend"><span>成功 <b>${fmtNum(s.success)}</b></span><span>处理中 <b>${fmtNum(s.processing)}</b></span><span>失败 <b>${fmtNum(s.failed)}</b></span><span>等待 <b>${fmtNum(s.waiting)}</b></span><span class="blocked">策略阻断 <b>${fmtNum(s.blocked)}</b></span><span>成功率 <b>${fmtPct(s.successRate)}</b></span></div></section><div class="dashboard-grid"><section class="panel"><div class="panel-title"><h3>账号实时转发</h3><span>${accounts.length?`${accounts.length} 个真实账号`:'尚无账号快照'}</span></div>${accounts.length?`<div class="account-grid">${accounts.map(accountCard).join('')}</div>`:`<div class="empty">Windows Nuvexa Pro 尚未上报真实账号状态。升级并启动 v0.2.7 后这里自动出现助理号、教授号和辅助号。</div>`}</section><aside class="side-stat"><section class="panel connection-card"><div class="panel-title"><h3>本地执行端</h3><span>Heartbeat</span></div><div class="big-status ${d.executorOnline?'ok':'bad'}">${d.executorOnline?'在线':'离线'}</div><div class="sync-note">${d.executorOnline?`最近心跳 ${fmtTime(d.snapshot?.executor?.heartbeatAt)}`:'当前不会显示假在线，也不会把云端按钮当作发送成功。'}</div></section><section class="panel connection-card ${p.enabled?'':'forbidden'}"><div class="panel-title"><h3>目标群发布状态</h3><span>Revision ${fmtNum(p.revision)}</span></div><div class="big-status ${p.enabled?'ok':'bad'}">${p.enabled?'允许发布':'发布禁区'}</div><div class="sync-note">${p.groupName?esc(p.groupName):'尚未选择统一目标群组'}</div></section><section class="panel"><div class="panel-title"><h3>路由链路</h3><span>Fail-closed</span></div><div class="route-flow"><div class="flow-node">Telegram 消息</div><div class="flow-arrow">↓</div><div class="flow-node">角色 / 编号 + 性别精确匹配</div><div class="flow-arrow">↓</div><div class="flow-node">对应 WhatsApp Session</div><div class="flow-arrow">↓</div><div class="flow-node">群组总开关校验 → 真实 ACK</div></div></section></aside></div>`}
function accountsPage(){const items=state.data?.snapshot?.accounts||[];const filters=[['ALL','全部账号'],['ASSISTANT','助理号'],['PROFESSOR','教授号'],['AUXILIARY','辅助号'],['ONLINE','在线'],['OFFLINE','离线']];const shown=items.filter(a=>state.filter==='ALL'||a.role===state.filter||(state.filter==='ONLINE'&&a.status==='online')||(state.filter==='OFFLINE'&&a.status!=='online'));return `<div class="page-head"><div><h1>账号管理</h1><p>只保留助理号、教授号、辅助号；编号、性别、Session 状态均来自本地真实数据。</p></div><div class="sync-note">${items.length} 个账号</div></div><div class="filters">${filters.map(f=>`<button data-filter="${f[0]}" class="${state.filter===f[0]?'active':''}">${f[1]}</button>`).join('')}</div><section class="panel"><div class="table-wrap"><table class="account-table"><thead><tr><th>账号</th><th>角色</th><th>编号/性别</th><th>WhatsApp Session</th><th>今日任务</th><th>成功/失败</th><th>成功率</th><th>能量条</th><th>最后心跳</th></tr></thead><tbody>${shown.map(a=>`<tr><td>${esc(a.name||'—')}</td><td>${esc(a.roleLabel||a.role)}</td><td>${a.kind==='AUXILIARY'?`${esc(a.auxCode||'—')} / ${esc(a.genderLabel||'未设置')}`:'—'}</td><td><span class="state ${a.status==='online'?'on':''}">${a.status==='online'?'在线':a.status==='not_bound'?'未绑定':'离线'}</span></td><td>${fmtNum(a.total)}</td><td>${fmtNum(a.success)} / ${fmtNum(a.failed)}</td><td class="pct">${fmtPct(a.successRate)}</td><td class="table-energy">${energy(a)}</td><td>${fmtTime(a.lastHeartbeatAt)}</td></tr>`).join('')||`<tr><td colspan="9"><div class="empty">没有符合筛选条件的真实账号。</div></td></tr>`}</tbody></table></div></section>`}
function groupPage(){const d=state.data||{},p=d.groupPolicy||{},c=d.snapshot?.groupCandidates||[],s=d.snapshot?.summary||{};const options=[...new Map(c.map(x=>[x.groupId,x])).values()];return `<div class="page-head"><div><h1>群组与转发设置</h1><p>所有助理号、教授号、辅助号统一发布到同一个 WhatsApp 群组。</p></div><div class="sync-note">策略版本 ${fmtNum(p.revision)}</div></div>${p.enabled?'':`<div class="forbidden-banner"><strong>🔒 发布禁区</strong><span>群组开关已关闭，所有账号禁止向目标群发送；队列任务保持等待，不改投其他群。</span></div>`}<div class="group-layout"><section class="panel group-hero ${p.enabled?'':'forbidden'}"><div class="panel-title"><h3>统一目标群组</h3><span>${d.executorOnline?'执行端已连接':'等待执行端'}</span></div><div class="group-form"><select id="groupSelect"><option value="">选择执行端真实发现的群组</option>${options.map(x=>`<option value="${esc(x.groupId)}" data-name="${esc(x.groupName)}" ${p.groupId===x.groupId?'selected':''}>${esc(x.groupName||x.groupId)}</option>`).join('')}</select><input id="manualGroupId" placeholder="或填写精确 WhatsApp 群组 ID（...@g.us）" value="${esc(p.groupId||'')}"><input id="manualGroupName" placeholder="群组名称" value="${esc(p.groupName||'')}"><button id="saveGroup" class="save-btn">保存唯一目标群</button></div><div class="group-switch"><div class="switch-copy"><strong>${p.enabled?'允许发布':'发布禁区'}</strong><p>${p.enabled?'所有符合规则的账号可向当前唯一目标群发送。':'所有账号禁止发布，等待中的任务不会被伪造为成功。'}</p></div><button id="policyToggle" class="switch ${p.enabled?'on':''}" aria-label="群组发布总开关"></button></div>${p.enabled?'':`<div class="policy-code">BLOCKED_BY_GROUP_POLICY</div>`}<div class="section-gap"><div class="panel-title"><h3>群组任务能量条</h3><span>${fmtPct(s.successRate)}</span></div>${energy(s)}<div class="energy-legend"><span>成功 <b>${fmtNum(s.success)}</b></span><span>失败 <b>${fmtNum(s.failed)}</b></span><span>等待 <b>${fmtNum(s.waiting)}</b></span><span>处理中 <b>${fmtNum(s.processing)}</b></span><span class="blocked">阻断 <b>${fmtNum(s.blocked)}</b></span></div></div></section><section class="panel"><div class="panel-title"><h3>Telegram → WhatsApp 路由</h3><span>单群组强制策略</span></div><div class="route-flow"><div class="flow-node"><b>01 · Telegram</b><br><span class="sync-note">接收教授 / 助理 / 辅助号消息</span></div><div class="flow-arrow">↓</div><div class="flow-node"><b>02 · 精确识别</b><br><span class="sync-note">角色，或辅助号编号 + 手动性别</span></div><div class="flow-arrow">↓</div><div class="flow-node"><b>03 · Session</b><br><span class="sync-note">只用匹配账号，不静默换号</span></div><div class="flow-arrow">↓</div><div class="flow-node"><b>04 · 群组总开关</b><br><span class="sync-note">入队前 + 实际发送前双重校验</span></div><div class="flow-arrow">↓</div><div class="flow-node"><b>05 · WhatsApp ACK</b><br><span class="sync-note">只有真实 ACK 才计 SUCCESS</span></div></div><div class="section-gap sync-note">当前目标：${p.groupName?`<b>${esc(p.groupName)}</b> · ${esc(p.groupId)}`:'尚未配置'}</div></section></div>`}
function bindDynamic(){if(state.page==='accounts')$$('[data-filter]').forEach(b=>b.addEventListener('click',()=>{state.filter=b.dataset.filter;render()}));if(state.page==='group'){const sel=$('#groupSelect');sel?.addEventListener('change',()=>{const opt=sel.options[sel.selectedIndex];if(sel.value){$('#manualGroupId').value=sel.value;$('#manualGroupName').value=opt.dataset.name||opt.textContent}});$('#saveGroup')?.addEventListener('click',async()=>{const id=$('#manualGroupId').value.trim(),name=$('#manualGroupName').value.trim();if(!id){toast('请先选择或填写目标群组',true);return}try{const r=await api('/v1/group-policy',{method:'PUT',body:JSON.stringify({groupId:id,groupName:name,enabled:state.data?.groupPolicy?.enabled===true})});state.data.groupPolicy=r.groupPolicy;toast('唯一目标群已保存');render()}catch(e){toast(e.message,true)}});$('#policyToggle')?.addEventListener('click',async()=>{const p=state.data?.groupPolicy||{},id=$('#manualGroupId')?.value.trim()||p.groupId,name=$('#manualGroupName')?.value.trim()||p.groupName;if(!p.enabled&&!id){toast('开启发布前必须先设置唯一目标群组',true);return}try{const r=await api('/v1/group-policy',{method:'PUT',body:JSON.stringify({enabled:!p.enabled,groupId:id,groupName:name})});state.data.groupPolicy=r.groupPolicy;updateChrome(state.data);toast(r.groupPolicy.enabled?'群组已开启：允许发布':'群组已关闭：进入发布禁区');render()}catch(e){toast(e.message,true)}})}}
function render(){if($('#appView').classList.contains('hidden'))return;const host=$('#pageHost');host.innerHTML=state.page==='accounts'?accountsPage():state.page==='group'?groupPage():dashboard();bindDynamic()}
(async()=>{cloudCheck();if(state.token){try{await api('/v1/auth/me');loginSuccess(state.token)}catch{logout()}}})();
</script>
</body>
</html>
