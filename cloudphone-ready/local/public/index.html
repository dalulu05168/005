<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CloudPhone 本地管理</title><link rel="stylesheet" href="styles.css"></head><body>
<section id="auth" class="auth-shell"><form id="authForm" class="auth-card"><div class="brand"><b>CP</b><div><h1>CloudPhone</h1><small>本机 Android 云手机管理</small></div></div><div class="tabs"><button type="button" id="tabLogin" class="active">登录</button><button type="button" id="tabRegister">注册</button></div><label>邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" minlength="10" required></label><label id="inviteField" class="hidden">邀请码<input id="invite" type="password" inputmode="numeric"></label><button id="authSubmit" class="primary">登录</button><p id="authMessage" class="error"></p></form></section>
<section id="app" class="hidden"><header><div><h1>CloudPhone</h1><small id="connection">正在连接本机设备</small></div><span class="spacer"></span><span id="signedUser"></span><button id="diagnostics">环境检查</button><button id="refresh">刷新</button><button id="logout">退出</button></header>
<main><div class="toolbar"><input id="filter" placeholder="搜索设备、AVD、尾号或备注"><span id="summary"></span></div><p id="message" role="status"></p><div id="cards" class="cards"></div><div id="empty" class="empty hidden">没有匹配的设备</div></main></section>
<dialog id="metaDialog"><form method="dialog"><div class="dialog-head"><h2>登记设备信息</h2><button>关闭</button></div><label>设备名称<input id="metaName" maxlength="32"></label><div class="grid"><label>WhatsApp 后四位<input id="metaWa" maxlength="4" inputmode="numeric"></label><label>Business 后四位<input id="metaBiz" maxlength="4" inputmode="numeric"></label></div><label>备注<input id="metaNote" maxlength="80"></label><div class="dialog-actions"><button value="cancel">取消</button><button type="button" id="metaSave" class="primary">保存</button></div></form></dialog>
<dialog id="accountDialog"><div class="dialog-head"><h2 id="accountTitle">选择账号</h2><button id="accountClose">关闭</button></div><p class="muted">号码尾号只有在 Android 账号服务可读取时显示。点击指定用户，系统会先切换 Android 用户再打开应用。</p><div id="accountRows"></div></dialog>
<dialog id="screenDialog" class="screen-dialog"><div class="dialog-head"><h2 id="screenTitle">设备画面</h2><button id="screenClose">关闭</button></div><div class="screen-wrap"><img id="screen" alt="设备截图"></div><div class="screen-tools"><button data-key="BACK">返回</button><button data-key="HOME">主页</button><input id="screenInput" maxlength="160" placeholder="输入英文或数字"><button id="screenSend">输入</button><button id="screenReload">刷新画面</button></div><small>点击画面可操作设备；这是按操作刷新的截图，不是视频。</small></dialog>
<dialog id="diagDialog"><div class="dialog-head"><h2>运行环境</h2><button id="diagClose">关闭</button></div><pre id="diagText"></pre></dialog>
<script src="app.js"></script></body></html>
